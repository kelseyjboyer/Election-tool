name: Election tracker

# Runs the tracker in ~50 minute shifts. State (snapshots, sent alerts) is carried
# between shifts in the Actions cache, so restarts never re-send alerts.
#
# Schedule: continuous. Each shift starts the next when it ends; the 15-minute cron
# is only a backup in case the chain breaks. Public repos get unlimited standard Actions minutes.
#
# Requires the repository secret NTFY_TOPIC (Settings > Secrets and variables > Actions).
#
# To stop early: GitHub > Actions > Election tracker > ... > Disable workflow.

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test notification first"
        type: boolean
        default: false
      shift_minutes:
        description: "How long this shift runs"
        type: number
        default: 50

concurrency:
  group: election-tracker
  cancel-in-progress: false   # one shift at a time; the next waits in the queue

permissions:
  contents: read
  actions: write   # lets each shift start the next one

env:
  TRACKER_ENABLED: "true"      # master switch: "true" to run, "false" to stop all shifts and alerts
  TRACKER_CONFIG: "config.calls.toml"   # calls-only watchlist (config.toml = full election-night list)
  STOP_AFTER: "2026-12-15"     # shifts exit immediately after this date (UTC)

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stop date
        id: gate
        run: |
          if [[ "$TRACKER_ENABLED" != "true" ]]; then
            echo "Tracker disabled (TRACKER_ENABLED=false); not running."; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$(date -u +%F)" > "$STOP_AFTER" ]]; then
            echo "Past STOP_AFTER ($STOP_AFTER); not running."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check NTFY_TOPIC secret
        id: secret
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.NFTY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Add the NTFY_TOPIC repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Restore state
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tracker-state-

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -t .

      - name: ntfy quota for this runner
        if: steps.gate.outputs.run == 'true'
        run: curl -sS -m 15 https://ntfy.sh/v1/account | python -c "import json,sys; d=json.load(sys.stdin)['stats']; print('ntfy messages remaining for this IP:', d['messages_remaining'])" || true

      - name: Test notification
        if: steps.gate.outputs.run == 'true' && inputs.send_test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.NFTY_TOPIC }}
        run: python -m tracker -c "$TRACKER_CONFIG" test-notify

      - name: Track (one shift)
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || secrets.NFTY_TOPIC }}
        run: |
          set +e
          minutes="${{ inputs.shift_minutes || 50 }}"
          timeout -s INT "$((minutes * 60))" python -m tracker -c "$TRACKER_CONFIG" run --no-server
          code=$?
          echo "tracker exited with $code (124 or 130 = normal end of shift)"
          tail -n 40 tracker.log || true
          exit 0

      - name: Save state
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub's cron schedule is unreliable, so each shift queues the next one itself.
      # (workflow_dispatch is one of the few events GITHUB_TOKEN is allowed to trigger.)
      - name: Start next shift
        if: always() && steps.secret.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml --ref "${{ github.ref_name }}" -f shift_minutes=50
