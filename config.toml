# Election results tracker configuration.
# Race IDs come from civicAPI. Use `python -m tracker discover "<search text>"` to find more.
#
# Per-race keys:
#   id        civicAPI race id (required)
#   label     short name used in alerts (defaults to the civicAPI election_name)
#   group     section on the results page: "control", "my_ballot", "senate", "house"
#   critical  true = decides House/Senate control. Shorter batch throttle, higher push priority.
#   priority  "normal" (default) or "low". Low races poll less often and get fewer batch alerts.
#   majority  chamber tallies only: seats needed for control.
#   note      free text shown on the results page.

[settings]
poll_interval_seconds = 90          # per race. Hard floor of 60 is enforced in code.
low_priority_poll_interval_seconds = 300
request_spacing_seconds = 1.0       # gap between any two API requests
batch_throttle_minutes = 10         # max one "new results" alert per race per window
critical_batch_throttle_minutes = 5
low_priority_batch_throttle_minutes = 60
milestones = [25, 50, 75, 90]
state_db = "state.db"
log_file = "tracker.log"
display_timezone = "America/Los_Angeles"
user_agent = "election-results-tracker/0.1"
api_base = "https://civicapi.org/api/v2"

[ntfy]
server = "https://ntfy.sh"
# Anyone who knows the topic name can read it. Pick something long and random.
# This repo is public, so keep the real topic in the NTFY_TOPIC secret, not here.
topic = ""                          # set via the NTFY_TOPIC environment variable or GitHub secret
token = ""                          # only needed for a protected/self-hosted topic

[delivery]
# Calls, retractions, lead changes, anomalies and flags push immediately.
# Routine updates (new results, milestones, seat counts) are bundled into one digest push.
digest_minutes = 10
# ntfy.sh allows 250 messages per day per IP without an account. Stay under it.
daily_limit = 240
# When fewer than this many sends remain, only high-priority alerts go out.
reserve_for_urgent = 60

[page]
enabled = true
port = 8765
output_dir = "site"
# Address your phone uses to reach this computer, e.g. "http://192.168.1.20:8765"
# or a Tailscale address. Leave empty to make notifications open civicapi.org/results.
public_url = ""

